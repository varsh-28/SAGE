[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsgraph"
version = "0.1.0"
description = "Ontology-grounded GraphRAG for enterprise incident diagnosis"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7",
    "pyshacl>=0.26",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pytest>=8"
]

[tool.setuptools.packages.find]
include = ["opsgraph*"]